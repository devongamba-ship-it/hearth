[project]
name = "hearth-ingest"
version = "0.1.0"
description = "Hearth ingest service — UDP listener + codec for RuView Tier-2 vitals packets."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    # IANA zone data for zoneinfo on platforms without a system tz database
    # (Windows). Linux resolves from /usr/share/zoneinfo either way.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Pinned exact: ruff's *default* rule set changed across minor releases
    # (0.16.0 expanded defaults well beyond the classic E/F set), which is what
    # silently broke `main` in BAT-57. Pin the tool and select rules explicitly
    # (below) so lint is deterministic regardless of what's on PyPI.
    "ruff==0.16.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The shared RuView codec lives at the repo root in `hearth/` (CLAUDE.md: "one
# module, both the simulator and the ingest listener import it"). Map it in here
# so `pip install -e .` from this app installs `hearth` alongside `ingest` —
# this is what makes `import hearth.packet` work in CI, which installs each app
# independently from its own directory.
[tool.setuptools]
packages = ["ingest", "hearth"]

[tool.setuptools.package-dir]
hearth = "../../hearth"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit rule selection = the lint contract this codebase was written against
# (ruff's long-standing classic default). Without this, the enforced rules track
# ruff's evolving *implicit* defaults; the 0.16.0 bump expanded them and flagged
# 73 pre-existing lines that were never in scope (BAT-57). Adopting the newer
# rules (RUF/DTZ/TRY/…) is a deliberate follow-up, not a silent dependency bump.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
