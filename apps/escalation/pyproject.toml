[project]
name = "hearth-escalation"
version = "0.1.0"
description = "Hearth escalation service — SMS/voice cascade via Twilio, dry-run by default."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Live Twilio delivery is human-set only (ESCALATION_MODE=live) and never
# installed/exercised in CI. The SDK is lazy-imported by TwilioNotifier.
live = [
    "twilio>=9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["escalation"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
