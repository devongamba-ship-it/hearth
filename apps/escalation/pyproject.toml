[project]
name = "hearth-escalation"
version = "0.1.0"
description = "Hearth escalation service — SMS/voice cascade via Twilio, dry-run by default."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Pinned exact: ruff's *default* rule set changed across minor releases
    # (0.16.0 expanded defaults well beyond the classic E/F set), which is what
    # silently broke `main` in BAT-57. Pin the tool and select rules explicitly
    # (below) so lint is deterministic regardless of what's on PyPI.
    "ruff==0.16.0",
]
# Live Twilio delivery is human-set only (ESCALATION_MODE=live) and never
# installed/exercised in CI. The SDK is lazy-imported by TwilioNotifier.
live = [
    "twilio>=9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["escalation"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit rule selection = the lint contract this codebase was written against
# (ruff's long-standing classic default). Without this, the enforced rules track
# ruff's evolving *implicit* defaults; the 0.16.0 bump expanded them and flagged
# pre-existing lines that were never in scope (BAT-57). Adopting the newer rules
# (RUF/DTZ/TRY/…) is a deliberate follow-up, not a silent dependency bump.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
